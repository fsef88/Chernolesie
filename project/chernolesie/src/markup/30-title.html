<!-- Иллюстративная UI-пластина нарисована отдельным asset; DOM только накладывает живые данные и интерактив. -->
<div id="titlescreen">
  <div id="tsFeaturedHero" aria-hidden="true"></div>
  <div class="ts-title-lockup">
    <img id="tsGlyph" src="@@A:art/30-title.html/tsglyph.webp@@" alt="">
    <h1>ЧЁРНОЛЕСЬЕ</h1>
    <div id="tsSub">Защитник Заставы</div>
     <div id="tsMetaGold" style="color:#d8b45a;text-shadow:0 1px 6px rgba(0,0,0,.6)">🪙 <span id="tsMetaGoldVal">0</span></div>
  </div>
  <aside class="ts-sidebar" aria-label="Меню заставы">
    <button type="button" data-title-action="tree" class="ts-nav-btn"><span class="nav-ico">🌳</span>ДРЕВО</button>
    <button type="button" data-title-action="achievements" class="ts-nav-btn"><span class="nav-ico">📜</span>СВИТКИ</button>
    <button type="button" data-title-action="stats" class="ts-nav-btn"><span class="nav-ico">🏆</span>РЕКОРДЫ</button>
    <button type="button" data-title-action="journal" class="ts-nav-btn"><span class="nav-ico">📖</span>ЛЕТОПИСЬ</button>
  </aside>

  <section class="ts-run-modes" aria-label="Выбор длительности похода">
    <div id="tsMode" role="group" aria-label="Длительность забега"></div>
  </section>

  <section class="ts-hero-panel" aria-label="Сведения о выбранном герое">
    <div class="ts-panel-rule"></div>
    <h2 id="tsHeroName">КРОВАВЫЙ ВОИН</h2>
    <p class="ts-hero-role" id="tsHeroArch">КЛИНОК И ЯРОСТЬ</p>
    <div class="ts-hearts" aria-label="Живучесть">♥ ♥ ♥ ♥ ♥</div>
    <div class="ts-hero-stats" id="tsHeroStats"></div>
    <div class="ts-hero-trait"><b>ОСОБЕННОСТЬ</b><p id="tsHeroDesc"></p></div>
    <div id="tsCorr" role="group" aria-label="Ступень Порчи"></div>
  </section>

  <section class="ts-class-deck" aria-label="Выбор защитника">
    <div id="tsRow"></div>
    <div id="tsLiveDeck" aria-label="Живая колода героев"></div>
    <div class="deck-pages" id="tsDeckPages" aria-hidden="true"></div>
  </section>

  <!-- v12.2: прозрачные зоны клика поверх НАРИСОВАННЫХ стрелок сцены -->
  <button class="ts-arrow-hit prev" id="tsDeckPrev" type="button" aria-label="Предыдущие герои"></button>
  <button class="ts-arrow-hit next" id="tsDeckNext" type="button" aria-label="Следующие герои"></button>
  <footer id="tsFooter">
    <button class="big" id="btnStartPoohd" type="button">⚔ <span>В БОЙ</span></button>
  </footer>
  <div id="devBossRushWrap" style="display:none"><button id="btnBossRush" type="button">⚙ сразу к Горынычу</button></div>
</div>
<div id="classUnlockToast"><div class="u1">ОТКРЫТ НОВЫЙ ПУТЬ</div><div class="u2" id="cutName"></div></div>
<div id="hitFlash"></div>
<div id="lowHpVignette"></div>
