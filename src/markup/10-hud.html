<div id="hud">
  <div class="left">
    <span class="stat time"><i class="ic i-time"></i><b id="time">00:00</b></span>
    <span class="stat hp"><i class="ic i-hp"></i><b id="hpnum">100</b></span>
  </div>
  <div class="center">
    <span class="stat bosseft" id="bosseft"><i class="ic i-boss"></i><b id="bosstimer">28:00</b></span>
    <span class="stat classdisp" id="classdisp"></span>
    <span id="weapons"></span>
  </div>
  <div class="right">
    <span class="stat lvl"><i class="ic i-lvl"></i><b id="lvl">1</b></span>
    <span class="stat kills"><i class="ic i-kills"></i><b id="kills">0</b></span>
    <span class="stat gold"><i class="ic i-gold"></i><b id="gold">0</b></span>
  </div>
</div>
<div id="xpbar"><div id="xpfill"></div></div>
<div id="boondisp"></div>
<div id="bossbar">
  <div id="bossname"></div>
  <div class="bbg"><div id="bosshp"></div></div>
  <div id="bossphase"></div>
</div>
<div id="relics">
  <div class="relic-slot" id="rs0"></div>
  <div class="relic-slot" id="rs1"></div>
  <div class="relic-slot" id="rs2"></div>
</div>
